name: update-stats

on:
  # 每天 UTC 00:30（北京时间 08:30）自动更新一次数据徽章
  schedule:
    - cron: "30 0 * * *"
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 需要写权限来提交更新后的 README
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新数据徽章
        run: python update-stats.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 提交更新（无变化则跳过）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "数据无变化，跳过提交" || {
            git commit -m "chore: update stats badges [skip ci]"
            git push
          }
